<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:type" content="Formulario Cables Especiales">
    <meta name="copyright" content="Emanuel Morano Solé">
    <link rel="icon" href="./images/favicon/favicon 32x32.ico" sizes="32x32" type="image/x-icon">
    <link rel="icon" href="./images/favicon/favicon 16x16.ico" sizes="16x16" type="image/x-icon">
    <title>Ferrazzi - Formulario Cables Especiales</title>
    <style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; color:#333; margin:0; padding:0;}
    .container { max-width:800px; margin:30px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1)}
    h1{font-size:26px;margin-bottom:10px;}
    p.desc{color:#555;margin-bottom:20px;}
    section{margin-bottom:25px;}
    label{font-weight:bold; display:block;margin-bottom:8px;margin-top: 14px;}
    input[type="text"],select,textarea,input[type="file"]{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-top:5px;}
    .options{margin-top:8px;}
    .options label{font-weight:normal; display:block; margin-bottom:6px;}
    .required{color:red;margin-left:4px;}
    button{background:#FE5000;color:#fff;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;font-size:16px;}
    button:hover{background:#d84500;}
    .card-container{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin-top:20px;}
    .cards{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #ccc;border-radius:8px;padding:10px;cursor:pointer;width:300px;text-align:center;box-sizing:border-box;}
    .cards input[type="radio"]{margin-bottom:8px;}
    .cards img{max-width:100%;height:auto;max-height:300px;margin-bottom:6px; border-radius: 6px;}
    .banner-img{width:100%;height:auto;display:block;border-radius:8px;}
    /*ocultar submenu*/
    .hidden {display: none;}
    /*correccion input type text*/
    input[type="text"], select, textarea, input[type="file"] {width: 100%;padding: 10px;border: 1px solid #ccc;border-radius: 6px;margin-top: 5px;box-sizing: border-box; /* Esto asegura que el padding y el borde se incluyan en el 100% del ancho */}
    .submenu-container {margin-top: 20px;}
    .submenu-capuchon {margin-bottom: 15px;}
    .model-card.selected-card {border: 2px solid #FE5000; box-shadow: 0 0 10px rgba(254, 80, 0, 0.5);}
    @media (max-width: 800px) {
    .card-container img {width: 100%;}
    .container {margin-right: 30px;margin-left: 30px;}
    }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner superior -->
        <div class="banner">
            <img src="./images/web/bannerFerrazzi.webp" alt="Ferrazzi" class="banner-img">
        </div>
    </div>

    <div class="container">
        <h1>Ferrazzi - Formulario de Cables Especiales</h1>
        <p class="desc">
            La fabricación de cables especiales se hace en Línea Competición de 9mm, color naranja. 
            La demora del mismo es de 7 días hábiles.
        </p>
        <!-- Aclaracion como tomar medidas de los cables -->
        <label for="medidas">Cuando coloque la medida de los cables, por favor tener en cuenta que los cables se miden de capuchón a capuchón contemplando el largo total.
            <div class="card-container">
                <img src="./images/web/largoCables.webp" alt="Largo de los cables">
            </div>
        </label>

        <form id="formCables">
            <!-- Distribuidor o bobinas -->
            <section>
                <label>El vehículo es con distribuidor o bobinas individuales? <span class="required">*</span></label>
                <div class="options">
                    <label><input type="radio" name="sistema" value="bobinas" required> Bobinas individuales</label>
                    <label><input type="radio" name="sistema" value="distribuidor"> Distribuidor</label>
                    <label><input type="radio" name="sistema" value="otro"> Otro (Personalizado por cable)</label>
                </div>
            </section>
            <!-- SUBMENÚ PARA DISTRIBUIDOR -->
            <section id="submenuDistribuidor" class="hidden">
                <h3>Opciones Distribuidor</h3>

                <label for="lado1_tipo">Tipo conexión Lado Distribuidor:</label>
                <select id="lado1_tipo" name="lado1_tipo">
                    <option value="">Elegir combinación...</option>
                    <option value="dist_90_pin">PIN 90°</option>
                    <option value="dist_180_pin">PIN 180°</option>
                    <option value="dist_90_din7">DIN 7mm Motorcraft 90°</option>    
                    <option value="dist_90_din8">DIN 8mm 90°</option>
                    <option value="dist_180_din8">DIN 8mm 180°</option>
                    <option value="dist_90_sae">SAE 90°</option>
                    <option value="dist_180_sae">SAE 180°</option>
                </select>

                <label for="lado2_tipo">Tipo conexión Lado Bobina:</label>
                <select id="lado2_tipo" name="lado2_tipo">
                    <option value="">Elegir combinación...</option>
                    <option value="gol_90_pin">PIN GOL 14mm 90°</option>
                    <option value="gol_180_pin">PIN GOL 14mm 180°</option>
                    <option value="corsa_90_pin">PIN CORSA 18mm 90°</option>
                    <option value="corsa_180_pin">PIN CORSA 18mm 180°</option>
                    <option value="onix_120_pin">PIN ONIX 120°</option>
                    <option value="zetec_90_pin">PIN ZETEC 90°</option>
                    <option value="Motorcraft_90_din7">DIN 7mm (Motorcraft) 90°</option>
                    <option value="falcon_90_din8">DIN 8mm (Falcon/128) 90°</option>
                    <option value="falcon_180_din8">DIN 8mm (Falcon/128) 180°</option>
                    <option value="uni_90_sae">SAE 90°</option>
                    <option value="uni_180_sae">SAE 180°</option>
                    <!-- <option value="DIS">SAE</option> -->
                </select>

                <label for="largo_cable">Largo del Cable (cm):</label>
                <input type="text" id="largo_cable" name="largo_cable" placeholder="Ej: 30">
            </section>

            <!-- Cantidad cilindros -->
            <section>
                <label for="cilindros">Indicar la cantidad de cilindros <span class="required">*</span></label>
                <select id="cilindros" name="cilindros" required>
                    <option value="">Elegir...</option>
                    <option>4</option>
                    <option>6</option>
                    <option>8</option>
                </select>
            </section>
            <section id="largosCilindros" class="hidden">
                <label>Largo de cables por cilindro (cm):</label>
                <div id="inputsLargos"></div>
            </section>
            <!-- Nuevo para tipo de cable -->
            <section>
                <label for="tipo_cable">Indicar tipo de cable <span class="required">*</span></label>
                <select id="tipo_cable" name="tipo_cable" required>
                    <option value="">Elegir...</option>
                    <option value="2005.0">Cable Silicona Cobre Negro 7 mm Ferrazzi</option>
                    <option value="2006.0">Cable Silicona Supresor Negro 7 mm Ferrazzi</option>
                    <option value="2014.0">Cable Silicona Supresor Espiralado Naranja 7 mm Ferrazzi</option>
                    <option value="2010.0">Cable Silicona Cobre/Acero 8.8 mm Ferrazzi</option>
                    <option value="2011.0">Cable Silicona Supresor Naranja 8.8 mm Ferrazzi</option>
                    <option value="2021.0">Cable Silicona Supresor Espiralado Naranja 8.8 mm Ferrazzi</option>
                </select>
            </section>

            <!-- Capuchones lado bujías -->
            <section>
                <label>Tipo de Capuchones, lado Bujías <span class="required">*</span></label>
                <!--
                <div class="options">
                    <label><input type="radio" name="metodo_seleccion_bujia" value="visual" required> Selección Visual</label>
                    <label><input type="radio" name="metodo_seleccion_bujia" value="codigo" required> Ingresar Código de Catálogo</label>
                </div>
                -->

                <div id="visual-selection-container"> <!--este div tenia el class="hidden" cuando tenias que seleccionar la categoria -->
                    <!--  
                    <label style="margin-top:20px;">Paso 1: Seleccione una categoría</label>
                    <div class="options card-container">
                        <label class="cards"><img src="./images/web/CF22_RECTO.webp" alt="RECTO"><span>Recto</span><input type="radio" name="cap_bujia_categoria" value="recto" data-single-model="true" data-model-value="CF22"  ></label>
                        <label class="cards"><img src="./images/web/CF19_90.webp" alt="A 90"><span>A 90°</span><input type="radio" name="cap_bujia_categoria" value="90"></label>
                        <label class="cards"><img src="./images/1x/RECTO_TIPOCORSA.jpg" alt="TIPO CORSA"><span>Recto, tipo Corsa</span><input type="radio" name="cap_bujia_categoria" value="corsa" data-single-model="true" data-model-value="Corsa Classic"> </label>
                        <label class="cards"><img src="./images/web/CF39_ANGULO.webp" alt="EN ANGULO"><span>En ángulo</span><input type="radio" name="cap_bujia_categoria" value="angulo"></label>
                    </div> -->
                    <label style="margin-top:20px;">Paso 1: Seleccione una categoría <span class="required">*</span></label>
                    <div class="options card-container">
                        <label class="cards "><img src="./images/web/CF22_RECTO.webp" alt="RECTO"><span>Recto</span><input type="radio" name="cap_bujia_categoria" value="recto" data-single-model="true" data-model-value="CF22" required></label>
                        <label class="cards "><img src="./images/web/CF19_90.webp" alt="A 90"><span>A 90°</span><input type="radio" name="cap_bujia_categoria" value="90" required></label>
                        <label class="cards "><img src="./images/web/CF39_ANGULO.webp" alt="EN ANGULO"><span>En ángulo</span><input type="radio" name="cap_bujia_categoria" value="angulo" required></label>
                        <label class="cards "><img src="./images/web/CF_incognito.webp" alt="OTRO"><span>Otro (escribir)</span><input type="radio" name="cap_bujia_categoria" value="otro" required></label>
                    </div>

                    <div id="submenus-capuchones" class="submenu-container">
                        <div id="submenu-recto" class="submenu-capuchon hidden">
                            <label>Paso 2: Seleccione el modelo</label>
                            <div class="options card-container">
                                <label class="cards model-card"><img src="./images/web/RECTO_BUJIA.webp" alt="CF22"><span>CF22</span><input type="radio" name="cap_bujia_modelo_final" value="CF22"></label>
                                
                            </div>

                        <div id="submenu-90" class="submenu-capuchon hidden">
                            <label>Paso 2: Seleccione el modelo<span class="required">*</span></label>
                            <div class="options card-container">
                                <label class="cards model-card"><img src="./images/web/CF19_90.webp" alt="CF19"><span>CF19</span><input type="radio" name="cap_bujia_modelo_final" value="CF19"></label>
                                <label class="cards model-card"><img src="./images/web/CF16_90.webp" alt="CF16"><span>CF16</span><input type="radio" name="cap_bujia_modelo_final" value="CF16"></label>
                                <!--<label class="cards model-card"><img src="./images/1x/CF24.jpg" alt="Modelo X"><span>CF24</span><input type="radio" name="cap_bujia_modelo_final" value="CF24"></label>-->
                                <!--<label class="cards model-card"><img src="./images/1x/CF230.jpg" alt="Modelo X"><span>CF230</span><input type="radio" name="cap_bujia_modelo_final" value="CF230"></label>-->
                            </div>
                        </div>
                        <div id="submenu-corsa" class="submenu-capuchon hidden">
                            <label>Paso 2: Seleccione el modelo</label>
                            <div class="options card-container">
                                <label class="cards model-card"><img src="./images/modelos/corsa_classic.jpg" alt="Corsa Classic"><span>Corsa Classic</span><input type="radio" name="cap_bujia_modelo_final" value="Corsa Classic"></label>
                            </div>
                        </div>
                        <div id="submenu-angulo" class="submenu-capuchon hidden">
                            <label>Paso 2: Seleccione el modelo<span class="required">*</span></label>
                            <div class="options card-container">
                                <label class="cards model-card"><img src="./images/web/CF15_ANGULO.webp" alt="Angulo 45 CF15"><span>CF15</span><input type="radio" name="cap_bujia_modelo_final" value="CF15"></label>
                                <label class="cards model-card"><img src="./images/web/CF39_ANGULO.webp" alt="Angulo 45 CF39"><span>CF39</span><input type="radio" name="cap_bujia_modelo_final" value="CF39"></label>
                            </div>
                        </div>
                        <div id="submenu-otro" class="submenu-capuchon hidden">
                            <label>Paso 2: Escriba el capuchón y el terminal</label>
                            <label for="cap_bujia_otro_capuchon" style="font-weight:normal;">Capuchón <span class="required">*</span></label>
                            <input type="text" id="cap_bujia_otro_capuchon" name="cap_bujia_otro_capuchon" placeholder="Ej: CF100 o descripción del capuchón">
                            <label for="cap_bujia_otro_terminal" style="font-weight:normal;">Terminal (opcional, pero se recomienda completarlo)</label>
                            <input type="text" id="cap_bujia_otro_terminal" name="cap_bujia_otro_terminal" placeholder="Ej: T35">
                        </div>
                    </div>
                </div>

                <!--  
                <div id="codigo-selection-container" class="hidden">
                    <label for="clase_producto_bujia" style="margin-top:20px;">Ingrese la Clase de Producto del catálogo:</label>
                    <input type="text" id="clase_producto_bujia" name="clase_producto_bujia" placeholder="Ej: A02-96">
                </div>
                -->
            </section>

            <!-- Nueva seccion que contempla Terminales y capuchones de las bobinas y del distribuidor segun lo que elija el user mas arriba -->
            <section id="config-bobina-section" class="hidden">
                <label for="combo_bobina">Configuración Lado Bobina <span class="required">*</span></label>
                <select id="combo_bobina" name="combo_bobina">
                    <option value="">Elegir combinación...</option>
                    <option value="gol_90_pin">PIN GOL 14mm 90°</option>
                    <option value="gol_180_pin">PIN GOL 14mm 180°</option>
                    <option value="corsa_90_pin">PIN CORSA 18mm 90°</option>
                    <option value="corsa_180_pin">PIN CORSA 18mm 180°</option>
                    <option value="onix_120_pin">PIN ONIX 120°</option>
                    <option value="zetec_90_pin">PIN ZETEC 90°</option>
                    <option value="Motorcraft_90_din7">DIN 7mm (Motorcraft) 90°</option>
                    <option value="falcon_90_din8">DIN 8mm (Falcon/128) 90°</option>
                    <option value="falcon_180_din8">DIN 8mm (Falcon/128) 180°</option>
                    <option value="uni_90_sae">SAE 90°</option>
                    <option value="uni_180_sae">SAE 180°</option>
                </select>
            </section>

            <section id="config-distribuidor-section" class="hidden">
                <label for="combo_distribuidor">Configuración Lado Distribuidor <span class="required">*</span></label>
                <select id="combo_distribuidor" name="combo_distribuidor">
                    <option value="">Elegir combinación...</option>
                    <option value="dist_90_pin">PIN 90°</option>
                    <option value="dist_180_pin">PIN 180°</option>
                    <option value="dist_90_din7">DIN 7mm Motorcraft 90°</option>    
                    <option value="dist_90_din8">DIN 8mm 90°</option>
                    <option value="dist_180_din8">DIN 8mm 180°</option>
                    <option value="dist_90_sae">SAE 90°</option>
                    <option value="dist_180_sae">SAE 180°</option>
                </select>
            </section>

            <!-- Seccion OTRO -->
            <section id="config-otro-section" class="hidden">
                <h3>Configuración Personalizada</h3>
                <label for="cantidad_cables_otro">Indicar la cantidad de cables <span class="required">*</span></label>
                <select id="cantidad_cables_otro" name="cantidad_cables_otro">
                    <option value="">Elegir...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>

                <div id="contenedor-cables-otro" style="margin-top: 20px;">
                </div>
            </section>

            <!-- Nota final -->
            <section>
                <label for="nota">¿Tenés algo que quieras agregar sobre tu pedido? Escribilo acá ⚡</label>

            </section>

            <button type="submit">Exportar a excel</button>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script>
        // --- LÓGICA DE VISIBILIDAD DEL FORMULARIO ---

        // 1. Lógica para Sistema (Bobina vs Distribuidor vs Otro)
        const sistemaRadios = document.querySelectorAll('input[name="sistema"]');
        const submenuDistribuidor = document.getElementById("submenuDistribuidor");
        const seccionConfigBobina = document.getElementById('config-bobina-section');
        const seccionConfigDistribuidor = document.getElementById('config-distribuidor-section');
        const seccionConfigOtro = document.getElementById('config-otro-section');
        const selectBobina = document.getElementById('combo_bobina');
        const selectDistribuidor = document.getElementById('combo_distribuidor');
        const selectCantidadOtro = document.getElementById('cantidad_cables_otro');
        
        // Elementos comunes que deben ocultarse si es "Otro"
        const seccionCilindrosComun = document.getElementById('cilindros').closest('section');
        const seccionLargosComun = document.getElementById('largosCilindros');
        const seccionTipoCableComun = document.getElementById('tipo_cable').closest('section');
        const seccionCapuchonesBujiaComun = document.getElementById('visual-selection-container').closest('section');

        sistemaRadios.forEach(radio => {
            radio.addEventListener("change", () => {
                // Resetear estado general
                submenuDistribuidor.classList.add("hidden");
                seccionConfigDistribuidor.classList.add("hidden");
                seccionConfigBobina.classList.add("hidden");
                seccionConfigOtro.classList.add("hidden");
                selectDistribuidor.required = false;
                selectBobina.required = false;
                selectCantidadOtro.required = false;

                // Mostrar/ocultar elementos comunes
                const esOtro = (radio.value === "otro" && radio.checked);
                seccionCilindrosComun.classList.toggle("hidden", esOtro);
                if (esOtro) seccionLargosComun.classList.add("hidden"); // Ocultar si o si al cambiar a otro
                seccionTipoCableComun.classList.toggle("hidden", esOtro);
                seccionCapuchonesBujiaComun.classList.toggle("hidden", esOtro);
                
                // Si NO es "otro", asegurarnos que los campos comunes sean requeridos
                document.getElementById('cilindros').required = !esOtro;
                document.getElementById('tipo_cable').required = !esOtro;
                
                // CORRECCIÓN: Quitar el "required" de la sección visual si está oculta para que el formulario se deje enviar
                document.querySelectorAll('input[name="cap_bujia_categoria"]').forEach(r => r.required = !esOtro);
                if (esOtro) {
                    document.querySelectorAll('input[name="cap_bujia_modelo_final"]').forEach(r => r.required = false);
                    // La sección de bujía queda oculta: apagar el required del capuchón escrito
                    inputOtroCapuchon.required = false;
                    inputOtroCapuchon.value = '';
                    inputOtroTerminal.value = '';
                }

                if (radio.value === "bobinas" && radio.checked) {
                    seccionConfigBobina.classList.remove("hidden");
                    selectBobina.required = true;
                } else if (radio.value === "distribuidor" && radio.checked) {
                    submenuDistribuidor.classList.remove("hidden");
                    seccionConfigDistribuidor.classList.remove("hidden");
                    selectDistribuidor.required = true;
                } else if (radio.value === "otro" && radio.checked) {
                    seccionConfigOtro.classList.remove("hidden");
                    selectCantidadOtro.required = true;
                }
            });
        });

        // Lógica para Generar Campos Personalizados ("Otro")
        const contenedorCablesOtro = document.getElementById('contenedor-cables-otro');
        const selectTipoCableHTML = document.getElementById('tipo_cable').innerHTML; // Clonar las opciones del select original
        
        // Extraer las opciones de los selectores originales para reusarlas
        const opcionesLadoBobina = document.getElementById('combo_bobina').innerHTML;
        const opcionesLadoDistribuidor = document.getElementById('combo_distribuidor').innerHTML;
        // Quitar el primer <option value="">Elegir combinación...</option> para no duplicarlo si los unimos
        const cleanLadoDistribuidor = opcionesLadoDistribuidor.replace('<option value="">Elegir combinación...</option>', '');

        // Lado 2 es la suma de todas las configuraciones (Bobina + Distribuidor)
        const opcionesLado2 = opcionesLadoBobina + cleanLadoDistribuidor;

        selectCantidadOtro.addEventListener('change', () => {
            const cantidad = parseInt(selectCantidadOtro.value) || 0;
            contenedorCablesOtro.innerHTML = ''; // Limpiar contenedor

            for (let i = 1; i <= cantidad; i++) {
                const bloqueCable = document.createElement('div');
                bloqueCable.style.border = "1px solid #ccc";
                bloqueCable.style.padding = "15px";
                bloqueCable.style.marginBottom = "15px";
                bloqueCable.style.borderRadius = "8px";
                bloqueCable.style.backgroundColor = "#fdfdfd";

                bloqueCable.innerHTML = `
                    <h4 style="margin-top: 0;">Cable ${i}</h4>
                    
                    <label>Indique el tipo de cable <span class="required">*</span></label>
                    <select name="otro_tipo_cable_${i}" required>
                        ${selectTipoCableHTML}
                    </select>

                    <label>Largo (cm) <span class="required">*</span></label>
                    <input type="text" name="otro_largo_${i}" placeholder="Ej: 45" required>

                    <label>Tipo de conexión Lado 1 (Bobinas) <span class="required">*</span></label>
                    <select name="otro_lado1_${i}" required>
                        ${opcionesLadoBobina}
                    </select>

                    <label>Tipo de conexión Lado 2 (Bujía / Distribuidor) <span class="required">*</span></label>
                    <select name="otro_lado2_${i}" required>
                        <option value="">Elegir combinación...</option>
                        <optgroup label="Lado Bujía">
                            <option value="CF22">CF22</option>
                            <option value="CF15">CF15</option>
                            <option value="CF39">CF39</option>
                            <option value="CF19">CF19</option>
                            <option value="CF16">CF16</option>
                        </optgroup>
                        <optgroup label="Lado Disttribuidor">
                            ${cleanLadoDistribuidor}
                        </optgroup>
                        <optgroup label="Personalizado">
                            <option value="__otro__">Otro (escribir capuchón y terminal)</option>
                        </optgroup>
                    </select>

                    <div id="otro_lado2_custom_${i}" class="hidden" style="margin-top:10px;padding:12px;border:1px dashed #FE5000;border-radius:6px;background:#fff8f5;">
                        <label style="font-weight:normal;margin-top:0;">Capuchón Lado 2 <span class="required">*</span></label>
                        <input type="text" name="otro_lado2_cap_${i}" placeholder="Ej: CF100 o descripción del capuchón">
                        <label style="font-weight:normal;">Terminal Lado 2 (opcional, pero se recomienda completarlo)</label>
                        <input type="text" name="otro_lado2_term_${i}" placeholder="Ej: T35">
                    </div>
                `;
                contenedorCablesOtro.appendChild(bloqueCable);
            }
        });

        // Mostrar/ocultar los campos de "Otro" del Lado 2 (delegado: los bloques se regeneran)

            const componentesOdoo = new Map();
            const siliconaPorCable = new Map(); // un pedido puede mezclar tipos de silicona

            const sumarComponenteOdoo = (codigo, cantidad, uomId, mapeado) => {
                if (!codigo || codigo === "N/A") return;
                const clave = `${codigo}||${uomId}`;
                const item = componentesOdoo.get(clave);
                if (item) { item.cantidad += cantidad; return; }
                componentesOdoo.set(clave, { codigo, cantidad, uomId, mapeado });

                sumarComponenteOdoo(codOdoo || codForm, 1, UOM_UNIDAD, !!codOdoo);

            const sumarTerminalOdoo = (codForm) => {
                if (!codForm || codForm === "N/A") return;
                const codOdoo = odooTerminales[codForm];
                sumarComponenteOdoo(codOdoo || codForm, 1, UOM_UNIDAD, !!codOdoo);
            };
            const sumarSiliconaOdoo = (codigoCable, largoCm) => {
                const largo = parseFloat(largoCm);
                if (!codigoCable || !largo) return;
                const acumulado = siliconaPorCable.get(codigoCable) || 0;

                    sumarSiliconaOdoo(codigoCable, largo);

                    sumarCapuchonOdoo(datosDistLado1.capuchon);
                    sumarTerminalOdoo(datosDistLado1.terminal);
                    sumarCapuchonOdoo(datosDistLado2.capuchon);
                    sumarTerminalOdoo(datosDistLado2.terminal);
                    sumarSiliconaOdoo(codigoCable, largoCableDistTecnico);

                headers.push("Lado Bujía", "Lado Motor", "Nota");

                filaClienteData = [datosCliente.cilindros, nombreCable, datosCliente.sistema, ...largosArray];
                if (sistema === 'distribuidor') filaClienteData.push(datosCliente.distribuidor_lado1_desc, datosCliente.distribuidor_lado2_desc, datosCliente.distribuidor_largo_cable_cm);
                filaClienteData.push(datosCliente.cap_bujia, datosCliente.configuracion_lado_motor, datosCliente.nota);

                const largosTecnicos = largosArray;
                filaTecnicaData = [datosCliente.cilindros, codigoCable, datosCliente.sistema, ...largosTecnicos];
                if (sistema === 'distribuidor') filaTecnicaData.push(`${datosDistLado1.capuchon}/${datosDistLado1.terminal}`, `${datosDistLado2.capuchon}/${datosDistLado2.terminal}`, largoCableDistTecnico);
                filaTecnicaData.push(`${datosTecnicos.cap_bujia} / ${datosTecnicos.terminal_bujia}`, `${datosTecnicos.cap_bobina} / ${datosTecnicos.terminal_bobina}`);

            } else {
                // --- NUEVA LÓGICA (MODO "OTRO" / PERSONALIZADO) ---
                const cantCablesOtro = parseInt(form.cantidad_cables_otro.value) || 0;
                datosCliente = {
                    cilindros: cantCablesOtro,
                    sistema: 'otro (personalizado)',
                    nota: form.nota.value
                };

                headers = ["Cant. Cables", "Sistema"];
                filaClienteData = [cantCablesOtro, "Otro"];
                filaTecnicaData = [cantCablesOtro, "Otro"];

                // Recorrer los bloques generados
                for(let i = 1; i <= cantCablesOtro; i++) {
                    const selCable = form[`otro_tipo_cable_${i}`];
                    const valCable = selCable.value; // Código técnico (ej: "2005.0")
                    const textCable = selCable.options[selCable.selectedIndex].text; // Nombre visible para el cliente
                    
                    const largo = form[`otro_largo_${i}`].value;
                    const valLado1 = form[`otro_lado1_${i}`].value;
                    const valLado2 = form[`otro_lado2_${i}`].value;

                    // Extraer datos técnicos de los diccionarios (Lado 1 asume base Bobina)
                    const datosL1 = datosBobinaCombinados[valLado1] || { capuchon: "N/A", terminal: "N/A" };
                    
                    // Lado 2 puede ser Visual, Distribuidor o escrito a mano ("Otro")
                    const selLado2 = form[`otro_lado2_${i}`];
                    let datosL2;
                    let textLado2 = selLado2.options[selLado2.selectedIndex].text;

                    if (valLado2 === '__otro__') {
                        const capL2 = form[`otro_lado2_cap_${i}`].value.trim().toUpperCase();
                        const termL2 = form[`otro_lado2_term_${i}`].value.trim().toUpperCase();
                        datosL2 = { capuchon: capL2, terminal: termL2 || "N/A" };
                        textLado2 = termL2 ? `Otro: ${capL2} / ${termL2}` : `Otro: ${capL2}`;
                    } else {
                        datosL2 = codigosCapuchonBujia[valLado2];
                        if (!datosL2) datosL2 = datosDistribuidorCombinados[valLado2] || { capuchon: "N/A", terminal: "N/A" };
                    }

                    // Generar string para la tabla de artículos
                    const terminales = `${datosL1.terminal}-${datosL2.terminal}`;
                    const capuchones = `${datosL1.capuchon}-${datosL2.capuchon}`;
                    articulos.push(`${valCable} largo ${largo} cm, ${terminales}/${capuchones}`);

                    // Acá cada cable puede llevar capuchones y hasta silicona distinta
                    sumarCapuchonOdoo(datosL1.capuchon);
                    sumarTerminalOdoo(datosL1.terminal);
                    sumarCapuchonOdoo(datosL2.capuchon);
                    sumarTerminalOdoo(datosL2.terminal);
                    sumarSiliconaOdoo(valCable, largo);

                    // Expandir columnas del Excel para el reporte general
                    headers.push(`Tipo Cable ${i}`, `Cable ${i} L1`, `Cable ${i} L2`, `Largo ${i}`);
                    filaClienteData.push(textCable, form[`otro_lado1_${i}`].options[form[`otro_lado1_${i}`].selectedIndex].text, textLado2, largo);
                    filaTecnicaData.push(valCable, `${datosL1.capuchon}/${datosL1.terminal}`, `${datosL2.capuchon}/${datosL2.terminal}`, largo);
                }

                headers.push("Nota");
                filaClienteData.push(datosCliente.nota);
                // filaTecnicaData no lleva nota
            }

            // 4. Crear y llenar el archivo Excel
            const workbook = new ExcelJS.Workbook();
            const hojaOdoo = workbook.addWorksheet("Importar Odoo");          // 1ra: lista para importar
            const sheet = workbook.addWorksheet("Pedido");                    // 2da: la de siempre
            const hojaInstrucciones = workbook.addWorksheet("Instrucciones"); // 3ra: cómo importarla
            // --- INICIO: Agregar Fila de Título Principal ---
            const titleRow = sheet.addRow(['Cables Especiales']);
            // Fusiona celdas (ajusta la 'G' si tienes más o menos columnas fijas antes de los largos)
            sheet.mergeCells('A1:J1'); 
            const titleCell = sheet.getCell('A1');
            titleCell.font = { size: 16, bold: true };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
            sheet.getRow(1).height = 30; // Aumentar altura de la fila del título

            // Añadir una fila vacía para separar
            sheet.addRow([]); 
            // --- FIN: Agregar Fila de Título Principal ---
            
            // --- INSERCIÓN DINÁMICA DE FILAS ---
            sheet.addRow(headers);
            sheet.addRow(filaClienteData).eachCell(cell => cell.alignment = { wrapText: true, vertical: 'middle', horizontal: 'center' });
            sheet.addRow(filaTecnicaData).eachCell(cell => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFA500' } };
                cell.alignment = { wrapText: true, vertical: 'middle', horizontal: 'center' };
            });

            // Tabla de Artículos en D12
            const filaInicioArticulos = 9; // <--- AGREGAR ESTA LÍNEA
            const columnaArticulos = 'D';   // <--- AGREGAR ESTA LÍNEA
            const headerCell = sheet.getCell(`${columnaArticulos}${filaInicioArticulos}`);
            headerCell.value = 'Articulo';
            headerCell.font = { bold: true };
            // Recorrer la lista de artículos (incluyendo el posible cable de distribuidor)
            articulos.forEach((articulo, index) => {
                const filaActual = filaInicioArticulos + 1 + index;
                const celdaArticulo = sheet.getCell(`${columnaArticulos}${filaActual}`);
                celdaArticulo.value = articulo;
                celdaArticulo.alignment = { wrapText: true, vertical: 'middle' };

                // NUEVO: Aplicar fondo celeste si es el cable del distribuidor
                // Verificamos si es el último índice Y si marcamos que se agregó el cable
                if (esCableDistribuidor && index === articulos.length - 1) {
                    celdaArticulo.fill = {
                        type: 'pattern',
                        pattern: 'solid',
                        fgColor: { argb: 'FFADD8E6' } // Celeste claro (LightBlue)
                    };
                }
            });
            // --- Añadir Bordes a las Tablas ---
            // Borde para la tabla principal (Filas 1 a 3)
            for (let i = 1; i <= 3; i++) { // Asumiendo 3 filas: Encabezado, Cliente, Técnica
                const row = sheet.getRow(i);
                row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                    // Solo aplica borde hasta la última columna con encabezado
                    if (colNumber <= headers.length) { 
                        cell.border = {
                            top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
                        };
                    }
                });
            }

            // Borde para la tabla de Artículos (D9 hacia abajo) - CORREGIDO
            const ultimaFilaArticulos = filaInicioArticulos + articulos.length; // Calcula la última fila
            for (let i = filaInicioArticulos; i <= ultimaFilaArticulos; i++) { // Empieza desde filaInicioArticulos (9)
                const cell = sheet.getCell(`D${i}`);
                cell.border = {
                    top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' }
                };
            }
            // --- Fin Bordes ---
            // 5. Descargar el archivo
            // Ajustar ancho de columnas
            sheet.columns.forEach(column => {
                let maxLen = 0;
                column.eachCell({ includeEmpty: true }, cell => {
                    let len = cell.value ? cell.value.toString().length : 0;
                    if (cell.value && typeof cell.value === 'string' && cell.value.includes('\n')) {
                    // Si hay saltos de línea, considera la línea más larga
                    len = Math.max(...cell.value.split('\n').map(line => line.length));
                    }
                    if (len > maxLen) {
                        maxLen = len;
                    }
                });
                // Añade un poco de padding y limita el ancho máximo
                column.width = Math.min(Math.max(maxLen, 10) + 2, 50); 
            });
            // Ajuste especial para la columna de Artículos (D) si existe
            const colArticulo = sheet.getColumn('D');
            if (colArticulo) colArticulo.width = 40; // Dale un ancho fijo más grande
            // --- HOJA 1: formato de importación de Odoo ---
            const AMARILLO = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };

            const filasOdoo = [];
            componentesOdoo.forEach(item => filasOdoo.push(item));
            siliconaPorCable.forEach((cm, codigo) => {
                // 3 decimales, igual que las LdM que ya están cargadas (ej: 2.325)
                filasOdoo.push({ codigo, cantidad: Math.round(cm * 10) / 1000, uomId: UOM_METRO, mapeado: true });
            });

            hojaOdoo.addRow([
                "id", "product_tmpl_id", "code", "sequence",
                "bom_line_ids/product_id", "bom_line_ids/product_qty", "bom_line_ids/product_uom_id/id"
            ]).eachCell(cell => { cell.font = { bold: true }; });

            filasOdoo.forEach((item, idx) => {
                // sequence -1 sólo en la primera fila (es un campo de la LdM, no de la línea).
                // Las LdM ya cargadas tienen sequence 0, así que con -1 la importada queda
                // arriba y es la que Odoo propone al lanzar una orden de fabricación.
                const fila = hojaOdoo.addRow(["", "", "", idx === 0 ? -1 : "", item.codigo, item.cantidad, item.uomId]);
                if (idx === 0) {
                    // Odoo exige el producto destino y su pantalla de importación no deja
                    // editar valores, sólo mapear columnas: esto se completa acá, en el Excel.
                    const celdaProducto = fila.getCell(2);
                    celdaProducto.value = "COMPLETAR ACA ANTES DE IMPORTAR";
                    celdaProducto.fill = AMARILLO;
                    celdaProducto.font = { bold: true };
                    celdaProducto.dataValidation = {
                        type: 'list',
                        allowBlank: false,
                        formulae: [`"${odooProductosDestino.join(',')}"`],
                        showErrorMessage: false, // no bloquear si maniana agregan un producto nuevo
                        promptTitle: 'Producto destino',
                        prompt: 'Eleg\u00ed el producto Cable especial al que se le va a cargar esta lista de materiales.'
                    };
                }
                if (!item.mapeado) {
                    const celdaComponente = fila.getCell(5);
                    celdaComponente.fill = AMARILLO;
                    celdaComponente.note = 'Escrito a mano en el formulario: no tiene código de Odoo. Corregilo o borrá la fila antes de importar.';
                }
            });
            [12, 34, 18, 11, 26, 16, 30].forEach((ancho, i) => { hojaOdoo.getColumn(i + 1).width = ancho; });

            // --- HOJA 3: instrucciones ---
            const tituloInstrucciones = hojaInstrucciones.addRow(["Cómo importar esta lista de materiales en Odoo"]);
            tituloInstrucciones.font = { size: 14, bold: true };
            hojaInstrucciones.addRow([]);
            [
                ["1", "PRIMERO, EN EXCEL. La pantalla de importación de Odoo sólo deja mapear columnas, no editar valores. Así que abrí este archivo, andá a la hoja 'Importar Odoo' y completá la celda amarilla de product_tmpl_id (columna B, fila 2). Tiene un desplegable con los productos 'Cable especial'. Después guardá el archivo."],
                ["2", "El producto va SÓLO en esa primera fila de datos. Las de abajo quedan vacías a propósito: así Odoo entiende que son líneas de la misma lista de materiales."],
                ["3", "Si alguna celda de bom_line_ids/product_id está en amarillo, es un capuchón o terminal que se escribió a mano en el formulario y no tiene código en Odoo. Corregilo por el código real o borrá esa fila. También antes de subir."],
                ["4", "Ya con el archivo guardado: Odoo → Fabricación → Productos → Listas de materiales, y pasá a vista de lista."],
                ["5", "Menú engranaje → Importar registros → Subir archivo, y elegí este archivo."],
                ["6", "Odoo toma la PRIMERA hoja del archivo, que es justamente 'Importar Odoo'. Si te ofreciera elegir la hoja, elegí esa. Las otras dos son de referencia y no se importan."],
                ["7", "Las columnas id y code van vacías a propósito: Odoo genera el identificador solo y la referencia es opcional."],
                ["8", "La columna sequence viene con -1 en la primera fila. Las listas que ya existen en el mismo producto tienen 0, así que la importada queda primera y es la que Odoo propone al lanzar la fabricación."],
                ["9", "Usá 'Testear importación' antes de confirmar. Si algo no coincide, Odoo lo marca sin crear nada."]
            ].forEach(fila => hojaInstrucciones.addRow(fila));

            hojaInstrucciones.addRow([]);
            const tituloDestinos = hojaInstrucciones.addRow(["Productos destino disponibles"]);
            tituloDestinos.font = { size: 12, bold: true };
            odooProductosDestino.forEach(nombre => hojaInstrucciones.addRow(["", nombre]));

            hojaInstrucciones.addRow([]);
            const tituloCalculo = hojaInstrucciones.addRow(["Cómo se calculó el cable de silicona"]);
            tituloCalculo.font = { size: 12, bold: true };
            [
                ["", "metros = suma de (largo de cada cable + 3,5 cm) / 100"],
                ["", "Los 3,5 cm son el sobrante de pelado y engarce. Sale de las listas de materiales que ya están cargadas en Odoo."],
                ["", "El cable del distribuidor, cuando corresponde, está incluido en ese total. Conviene que producción lo confirme."]
            ].forEach(fila => hojaInstrucciones.addRow(fila));

            hojaInstrucciones.addRow([]);
            const tituloExcluido = hojaInstrucciones.addRow(["Qué no incluye esta lista"]);
            tituloExcluido.font = { size: 12, bold: true };
            hojaInstrucciones.addRow(["", "No se agregan envase, caja ni kit de accesorios. Si el circuito los necesita, se cargan a mano en Odoo después de importar."]);

            hojaInstrucciones.getColumn(1).width = 6;
            hojaInstrucciones.getColumn(2).width = 110;
            hojaInstrucciones.eachRow(fila => {
                fila.getCell(2).alignment = { wrapText: true, vertical: 'top' };
            });

            const buf = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buf], { type: "application/octet-stream" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "pedido_completo.xlsx";
            a.click();
            URL.revokeObjectURL(a.href);
        });
    </script>


</body>
